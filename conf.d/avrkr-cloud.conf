# Avrkr Cloud reverse proxy (adjust server_name and TLS paths)
upstream avrkr_nextjs {
    server 127.0.0.1:3000;
}

upstream avrkr_realtime {
    server 127.0.0.1:3001;
}

server {
    listen 443 ssl http2;
    server_name app.avrkr.tech;

    # ssl_certificate     /etc/ssl/certs/avrkr.crt;
    # ssl_certificate_key /etc/ssl/private/avrkr.key;

    location / {
        proxy_pass http://avrkr_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://avrkr_realtime/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl http2;
    server_name sip.avrkr.tech;

    location /ws {
        proxy_pass https://127.0.0.1:8089/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_ssl_verify off;
    }
}
