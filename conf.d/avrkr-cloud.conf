# Avrkr Cloud — HTTP reverse proxy (nginx starts without TLS certs).
# For HTTPS, enable conf after certs exist:
#   cp avrkr-cloud-ssl.conf.example /etc/nginx/conf.d/avrkr-cloud-ssl.conf
#   nginx -t && systemctl reload nginx

upstream avrkr_nextjs {
    server 127.0.0.1:3000;
}

upstream avrkr_realtime {
    server 127.0.0.1:3001;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.avrkr.tech _;

    location / {
        proxy_pass http://avrkr_nextjs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://avrkr_realtime/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
    }
}

# SIP WebSocket via nginx (use ws:// on port 80 until TLS is enabled).
# Browsers for production WebRTC usually need wss:// — see avrkr-cloud-ssl.conf.example
server {
    listen 80;
    listen [::]:80;
    server_name sip.avrkr.tech;

    location /ws {
        proxy_pass https://127.0.0.1:8089/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_ssl_verify off;
    }
}
